plugins {
    // Versions declared here (apply false) so subprojects can apply them imperatively onto a shared
    // buildscript classloader — required so Architectury's platform DSL can see Loom's classes.
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'dev.architectury.loom-no-remap' version '1.14-SNAPSHOT' apply false
    id 'net.darkhax.curseforgegradle' version '1.2.30' apply false
    id 'com.modrinth.minotaur' version '2.9.0' apply false
}

architectury {
    minecraft = minecraft_version
}

allprojects {
    group = 'mekanism'
    version = mod_version
}

defaultTasks('build')

tasks.named('wrapper', Wrapper) {
    gradleVersion = '9.5'
    distributionType = Wrapper.DistributionType.ALL
}

tasks.named('updateDaemonJvm', org.gradle.buildconfiguration.tasks.UpdateDaemonJvm) {
    languageVersion = JavaLanguageVersion.of("${java_version}")
}
