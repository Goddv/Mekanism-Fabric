apply plugin: 'dev.architectury.loom-no-remap'
apply plugin: 'architectury-plugin'

architectury {
    common 'neoforge', 'fabric'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases/' }
    maven { url = 'https://maven.architectury.dev/' }
}

dependencies {
    // 26.1 deobfuscated -> no `mappings` line (no-remap)
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // JSR-305 nullability annotations used by mekanism.api.annotations (compile-time only; NeoForge
    // provides these transitively, Fabric does not — they are static-analysis only, never read at runtime).
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
